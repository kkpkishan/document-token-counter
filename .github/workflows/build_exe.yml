name: Build and Upload Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        python -c "import site; print(site.getsitepackages()[0])" > site_packages_path.txt
        $site_packages = Get-Content site_packages_path.txt
        pyinstaller --onefile --hidden-import tiktoken_ext.openai_public --hidden-import tiktoken_ext.google_cloud --hidden-import tiktoken_ext.anthropic_public --add-data "$site_packages\tiktoken_ext;tiktoken_ext" --add-data "$site_packages\PyPDF2;PyPDF2" --add-data "$site_packages\docx;docx" --add-data "$site_packages\pptx;pptx" --add-data "$site_packages\pandas;pandas" --add-data "$site_packages\openpyxl;openpyxl" token_counter.py

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: token_counter
        path: dist/token_counter.exe
