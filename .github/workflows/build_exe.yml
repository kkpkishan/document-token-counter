name: Build and Upload Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        $site_packages = python -c "import site; print(site.getsitepackages()[0])"
        $pyinstaller_command = "pyinstaller --onefile --hidden-import tiktoken_ext.openai_public --hidden-import tiktoken_ext.google_cloud --hidden-import tiktoken_ext.anthropic_public"
        
        $directories = @("tiktoken_ext", "PyPDF2", "docx", "pptx", "pandas", "openpyxl")
        foreach ($dir in $directories) {
          if (Test-Path "$site_packages\$dir") {
            $pyinstaller_command += " --add-data `"$site_packages\$dir;$dir`""
          } else {
            Write-Host "Directory $dir not found in site-packages"
          }
        }
        
        $pyinstaller_command += " token_counter.py"
        Invoke-Expression $pyinstaller_command

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: token_counter
        path: dist/token_counter.exe
