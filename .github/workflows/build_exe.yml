name: Build and Release Executable

on:
  push:
    branches:
      - main  # or your default branch name
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        $site_packages = python -c "import site; print(site.getsitepackages()[0])"
        $pyinstaller_command = "pyinstaller --onefile --collect-all numpy --collect-all pandas --collect-all PyPDF2 --collect-all docx --collect-all pptx --collect-all openpyxl --collect-all xlrd --collect-all win32com --collect-all tiktoken"
        
        $pyinstaller_command += " --hidden-import numpy --hidden-import pandas --hidden-import PyPDF2 --hidden-import docx --hidden-import pptx --hidden-import openpyxl --hidden-import xlrd --hidden-import win32com --hidden-import tiktoken"
        
        $pyinstaller_command += " --hidden-import tiktoken_ext.openai_public --hidden-import tiktoken_ext.google_cloud --hidden-import tiktoken_ext.anthropic_public"
        
        $directories = @("numpy", "pandas", "PyPDF2", "docx", "pptx", "openpyxl", "xlrd", "win32com", "tiktoken", "tqdm")
        foreach ($dir in $directories) {
          if (Test-Path "$site_packages\$dir") {
            $pyinstaller_command += " --add-data `"$site_packages\$dir;$dir`""
          } else {
            Write-Host "Directory $dir not found in site-packages"
          }
        }
        
        $pyinstaller_command += " token_counter.py"
        Invoke-Expression $pyinstaller_command

    - name: Get latest release
      id: get_latest_release
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const version = latestRelease.data.tag_name.replace('v', '').split('.');
            version[2] = parseInt(version[2]) + 1;
            const newVersion = 'v' + version.join('.');
            console.log(`New version: ${newVersion}`);
            core.setOutput('new_version', newVersion);
          } catch (error) {
            if (error.status === 404) {
              console.log('No previous release found. Starting with v1.0.0');
              core.setOutput('new_version', 'v1.0.0');
            } else {
              throw error;
            }
          }

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_latest_release.outputs.new_version }}
        release_name: Release ${{ github.ref_type == 'tag' && github.ref_name || steps.get_latest_release.outputs.new_version }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/token_counter.exe
        asset_name: token_counter.exe
        asset_content_type: application/octet-stream