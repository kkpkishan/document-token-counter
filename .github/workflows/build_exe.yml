name: Build and Release Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip freeze

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          $site_packages = python -c "import site,sys; print(next(p for p in site.getsitepackages() if 'site-packages' in p))"

          # NOTE: using pypdf (not PyPDF2) and including win32com unconditionally
          $pyi  = "pyinstaller --onefile --name token_counter"
          $pyi += " --collect-all numpy --collect-all pandas --collect-all pypdf --collect-all docx --collect-all pptx --collect-all openpyxl --collect-all xlrd --collect-all tiktoken"
          $pyi += " --collect-all win32com --collect-all win32"

          $pyi += " --hidden-import numpy --hidden-import pandas --hidden-import pypdf --hidden-import docx --hidden-import pptx --hidden-import openpyxl --hidden-import xlrd --hidden-import tiktoken"
          $pyi += " --hidden-import win32com --hidden-import pythoncom"

          $pyi += " --hidden-import tiktoken_ext.openai_public --hidden-import tiktoken_ext.google_cloud --hidden-import tiktoken_ext.anthropic_public"

          # add-data (defensive); ok if some don’t exist
          $directories = @("numpy","pandas","pypdf","docx","pptx","openpyxl","xlrd","win32com","win32","tiktoken","tqdm")
          foreach ($dir in $directories) {
            if (Test-Path "$site_packages\$dir") {
              $pyi += " --add-data `"$site_packages\$dir;$dir`""
            } else {
              Write-Host "Directory $dir not found in site-packages"
            }
          }

          $pyi += " token_counter.py"
          Write-Host "Running: $pyi"
          Invoke-Expression $pyi

          if (-not (Test-Path ".\dist\token_counter.exe")) {
            Write-Error "Build failed: dist\token_counter.exe not found."
            exit 1
          }

      - name: Upload build artifact (for workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: token_counter.exe
          path: dist/token_counter.exe

      - name: Compute next version if not building from tag
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            if (context.ref.startsWith('refs/tags/')) {
              const tag = context.ref.replace('refs/tags/', '');
              core.setOutput('tag', tag);
              return;
            }
            try {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const parts = latest.data.tag_name.replace(/^v/, '').split('.');
              parts[2] = String(parseInt(parts[2] || '0') + 1);
              const next = 'v' + parts.join('.');
              core.setOutput('tag', next);
            } catch (err) {
              if (err.status === 404) {
                core.setOutput('tag', 'v1.0.0');
              } else {
                throw err;
              }
            }

      - name: Create GitHub Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            dist/token_counter.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
