name: Build and Upload Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        pyinstaller --onefile --hidden-import tiktoken_ext.openai_public --hidden-import tiktoken_ext.google_cloud --hidden-import tiktoken_ext.anthropic_public --add-data "venv/Lib/site-packages/tiktoken_ext;tiktoken_ext" --add-data "venv/Lib/site-packages/PyPDF2;PyPDF2" --add-data "venv/Lib/site-packages/docx;docx" --add-data "venv/Lib/site-packages/pptx;pptx" --add-data "venv/Lib/site-packages/pandas;pandas" --add-data "venv/Lib/site-packages/openpyxl;openpyxl" token_counter.py

    - name: Upload executable
      uses: actions/upload-artifact@v3
      with:
        name: token_counter
        path: dist/token_counter.exe
